# ============================================================================
# ПРИМЕР 2A: машина A — публичный прокси-сервер (реальный сценарий, 2 машины).
#
# Запуск НА машине A:
#   $env:KEY = "my-secret"               # ключ (должен совпадать с машиной B)
#   docker compose -f docker-compose.machine-a.yml up -d --build
#
# Публичный порт 27015/udp — сюда подключаются игроки. Адрес машины B прокси-сервер
# определяет автоматически по первому кадру туннеля (PING от прокси-клиента), поэтому
# MACHINE_B_IP больше не нужен. Порт 5600 должен быть открыт на файрволе машины B.
# ============================================================================

services:
  proxyserver:
    build:
      context: .
      target: server
    command:
      # --port [порт игроков] --key
      - "--port"
      - "27015"
      - "--key"
      - "${KEY:-example-secret-key}"
    ports:
      - "27015:27015/udp"       # для игроков (и для приёма ответов от машины B)
    restart: unless-stopped
