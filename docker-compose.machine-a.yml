# ============================================================================
# ПРИМЕР 2A: машина A — публичный прокси-сервер (реальный сценарий, 2 машины).
#
# Запуск НА машине A:
#   $env:MACHINE_B_IP = "5.5.5.5"        # публичный IP машины B
#   $env:KEY = "my-secret"               # ключ (должен совпадать с машиной B)
#   docker compose -f docker-compose.machine-a.yml up -d --build
#
# Публичный порт 27015/udp — сюда подключаются игроки. Кадры туннеля уходят
# на машину B (порт 5600 должен быть открыт на её файрволе).
# ============================================================================

services:
  proxyserver:
    build:
      context: .
      target: server
    command:
      # --port [порт игроков] --client [прокси-клиент:порт туннеля] --key
      - "--port"
      - "27015"
      - "--client"
      - "${MACHINE_B_IP:-5.5.5.5}:5600"
      - "--key"
      - "${KEY:-example-secret-key}"
    ports:
      - "27015:27015/udp"       # для игроков (и для приёма ответов от машины B)
    restart: unless-stopped
