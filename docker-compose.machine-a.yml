# ============================================================================
# ПРИМЕР 2A: машина A — публичный прокси-сервер (реальный сценарий, 2 машины).
#
# Запуск НА машине A:
#   $env:KEY = "my-secret"               # ключ (должен совпадать с машиной B)
#   docker compose -f docker-compose.machine-a.yml up -d --build
#
# Публичные порты 27015/udp (игроки) и 5600/udp (туннель) открыты на машине A —
# на машине B открывать порты не нужно. Адрес машины B прокси-сервер определяет
# автоматически по первому кадру туннеля (PING от прокси-клиента), поэтому
# MACHINE_B_IP больше не нужен.
# ============================================================================

services:
  proxyserver:
    build:
      context: .
      target: server
    command:
      # --port [порт игроков] --tunnel-port [порт туннеля] --key
      - "--port"
      - "27015"
      - "--tunnel-port"
      - "5600"
      - "--key"
      - "${KEY:-example-secret-key}"
    ports:
      - "27015:27015/udp"       # для игроков
      - "5600:5600/udp"         # порт туннеля (приём кадров от машины B)
    restart: unless-stopped
