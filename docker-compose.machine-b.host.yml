# ============================================================================
# ПРИМЕР 2B-HOST: машина B — прокси-клиент, игровой сервер ЗАПУЩЕН НА ХОСТЕ.
#
# Для случая, когда настоящий игровой сервер работает прямо на хосте машины B
# (а не внутри контейнера). Контейнер прокси-клиента запускается в host-режиме
# (network_mode: host), чтобы:
#   * Docker NAT не переписывал подменённый source IP игроков — игровой сервер
#     видит настоящий IP клиента, а не шлюз docker-сети (172.18.0.1 и т.п.);
#   * инжект шёл в loopback хоста (--game-ip 127.0.0.1), где слушает игра;
#   * ответы игры на IP игрока (добавленный в loopback-алиасы хоста) уходили
#     в локальный стек и перехватывались сниффером прокси-клиента.
#
# Запуск НА машине B (Linux с нативным Docker):
#   $env:MACHINE_A_IP = "1.2.3.4"        # публичный IP машины A
#   $env:KEY = "my-secret"               # ключ (должен совпадать с машиной A)
#   docker compose -f docker-compose.machine-b.host.yml up -d --build
#
# ВАЖНО:
#   * игровой сервер должен быть запущен НА ХОСТЕ машины B на UDP-порту
#     --game-port (по умолчанию 7777);
#   * если машина B — Windows с Docker Desktop, host-режим делит сеть Linux-VM,
#     а не Windows; тогда запускайте прокси-клиента прямо на хосте (см. README).
# ============================================================================

services:
  proxyclient:
    build:
      context: .
      target: client
    command:
      - "--server"
      - "${MACHINE_A_IP:-1.2.3.4}"   # публичный IP машины A (без порта — туннель идёт на её порт туннеля)
      - "--tunnel-port"
      - "5600"                       # порт туннеля машины A
      - "--game-ip"
      - "127.0.0.1"             # игра на хосте машины B
      - "--game-port"
      - "7777"                       # UDP-порт игрового сервера на хосте
      - "--capture"
      - "true"
      - "--aliases"
      - "true"
      - "--key"
      - "${KEY:-example-secret-key}"
    network_mode: host               # делим сетевой стек хоста (Linux)
    cap_add:
      - NET_RAW                      # raw-сокеты (впрыск пакетов, сниффер)
      - NET_ADMIN                    # ip addr add/del на loopback
    restart: unless-stopped
