# ============================================================================
# ПРИМЕР 2B: машина B — прокси-клиент + игровой сервер (реальный сценарий, 2 машины).
# Запускать НА машине, где работает игровой UDP-сервер.
#
# Запуск НА машине B:
#   $env:MACHINE_A_IP = "1.2.3.4"        # публичный IP машины A
#   $env:KEY = "my-secret"               # ключ (должен совпадать с машиной A)
#   docker compose -f docker-compose.machine-b.yml up -d --build
#
# Порт 5600 — это порт туннеля на МАШИНЕ A; прокси-клиент сам устанавливает
# исходящее UDP-соединение на A:5600 и никаких портов наружу не открывает.
# Порт 7777 игрового сервера наружу НЕ публикуется: игроки приходят только
# через туннель.
#
# ВАЖНО: игровой сервер (docker/gamesrv.py) слушает 0.0.0.0:7777 внутри этого
# же контейнера — для реальной игры замените его своим игровым сервером, но
# запускайте его В ЭТОМ ЖЕ КОНТЕЙНЕРЕ/СЕТЕВОМ ПРОСТРАНСТВЕ, что и прокси-клиент,
# чтобы ответы возвращались через loopback в сниффер прокси-клиента.
# НЕ запускайте игру на хосте машины B, пока прокси-клиент в контейнере:
# ответы игрового сервера уйдут в реальную сеть (по настоящему IP игрока) и
# не попадут в перехватчик на loopback контейнера. Если игра на хосте —
# запускайте и прокси-клиент на хосте (см. README, Linux/Windows).
# ============================================================================

services:
  proxyclient:
    build:
      context: .
      target: client
    entrypoint: ["/app/machine-b-entrypoint.sh"]   # поднимает игровой сервер и клиента
    command:
      # --server [прокси-сервер] --tunnel-port [порт туннеля сервера] --game-ip
      #            --game-port --capture true/false --aliases true/false --key
      - "--server"
      - "${MACHINE_A_IP:-1.2.3.4}"   # IP машины A (без порта — туннель идёт на её порт туннеля)
      - "--tunnel-port"
      - "5600"                       # порт туннеля машины A
      - "--game-ip"
      - "127.0.0.1"             # игровой сервер в этом же контейнере
      - "--game-port"
      - "7777"
      - "--capture"
      - "true"                  # перехватывать ответы игрового сервера
      - "--aliases"
      - "true"                  # добавлять IP игроков на lo (ip addr add)
      - "--key"
      - "${KEY:-example-secret-key}"
    cap_add:
      - NET_RAW                 # raw-сокеты (впрыск пакетов, сниффер)
      - NET_ADMIN               # ip addr add/del на loopback
    restart: unless-stopped
